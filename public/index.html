<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктори постів Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root { --paper:#f4f5f7; --surface:#fff; --ink:#161b26; --muted:#636b7a; --line:#e1e4ea; --accent:#3b3fd8; color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --paper:#11141b; --surface:#1a1e28; --ink:#e9ecf2; --muted:#9aa1b0; --line:#2a3040; --accent:#8c90ff; color-scheme:dark; } }
body { margin:0; background:var(--paper); color:var(--ink); font:400 16px/1.6 'Golos Text', system-ui, sans-serif; }
main { max-width:760px; margin:0 auto; padding:3.5rem 1.25rem; }
h1 { font:600 2rem/1.2 'Unbounded', system-ui, sans-serif; margin:0 0 .75rem; }
p { color:var(--muted); margin:0 0 2rem; }
ul { list-style:none; padding:0; margin:0; display:grid; gap:.75rem; }
a { display:block; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1rem 1.25rem; color:var(--ink); text-decoration:none; font-weight:600; }
a:hover { border-color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Конструктори постів</h1>
  <p>Обери кампанію, збери свій пост і поділися ним у LinkedIn.</p>
  <ul>
    <!-- Додавай кампанії сюди: <li><a href="/slug.html">Назва</a></li> -->
    <li><a href="/demo-thursday-talks.html">Демо: Thursday Talks про AI в продукті</a></li>
  </ul>
</main>
</body>
</html>
