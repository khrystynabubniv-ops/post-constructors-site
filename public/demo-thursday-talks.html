<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Демо: Thursday Talks про AI в продукті · конструктор поста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
<style>
:root {
  --paper: #f4f5f7; --surface: #ffffff; --ink: #161b26; --muted: #636b7a;
  --line: #e1e4ea; --accent: #3b3fd8; --accent-ink: #ffffff; --tag: #eef0f4;
  --display: 'Unbounded', 'Golos Text', system-ui, sans-serif;
  --text: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141b; --surface: #1a1e28; --ink: #e9ecf2; --muted: #9aa1b0;
    --line: #2a3040; --accent: #8c90ff; --accent-ink: #11141b; --tag: #242a37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141b; --surface: #1a1e28; --ink: #e9ecf2; --muted: #9aa1b0;
  --line: #2a3040; --accent: #8c90ff; --accent-ink: #11141b; --tag: #242a37;
  color-scheme: dark;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--text); -webkit-font-smoothing: antialiased; }
main { max-width: 760px; margin: 0 auto; padding: 3.5rem 1.25rem 5rem; }
h1 { font: 600 clamp(1.8rem, 5vw, 2.6rem)/1.15 var(--display); letter-spacing: -0.02em; margin: 0 0 1.25rem; }
h2 { font: 600 1.15rem/1.3 var(--display); margin: 3rem 0 1rem; }
.intro p { margin: 0 0 0.9rem; color: var(--muted); max-width: 64ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem 1.25rem 1.25rem; margin-top: 1rem; }
.panel h3 { font: 600 0.95rem/1.3 var(--text); margin: 0; }
.panel .hint { font-size: 0.82rem; color: var(--muted); margin: 0.15rem 0 0.8rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip { font: 500 0.88rem/1 var(--text); padding: 0.6rem 0.95rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip:disabled { opacity: 0.4; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
button { font: inherit; cursor: pointer; }
.btn { font: 600 0.92rem/1 var(--text); padding: 0.95rem 1.3rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 0.6rem 0.9rem; font-size: 0.85rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#results { margin-top: 2rem; display: grid; gap: 1rem; }
.empty { text-align: center; color: var(--muted); padding: 2.5rem 1rem; border: 1px dashed var(--line); border-radius: 12px; }
.post { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem; }
.tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.9rem; }
.tag { font-size: 0.78rem; background: var(--tag); color: var(--muted); padding: 0.25rem 0.6rem; border-radius: 6px; }
.post-text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font: inherit; }
.post-foot { display: flex; align-items: center; gap: 0.5rem; margin-top: 1.1rem; flex-wrap: wrap; }
.count { margin-left: auto; font-size: 0.8rem; color: var(--muted); }
.creatives { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
.creative { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.creative img { width: 100%; max-width: 100%; display: block; aspect-ratio: 4 / 5; object-fit: cover; background: var(--tag); }
.creative .cap { padding: 0.75rem 0.9rem 0.25rem; font-size: 0.88rem; }
.creative a { margin: 0.5rem 0.9rem 0.9rem; font-size: 0.85rem; color: var(--accent); font-weight: 600; text-decoration: none; }
.creative a:hover { text-decoration: underline; }
.post-creatives { margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.post-creatives h4 { font: 600 0.85rem/1.3 var(--text); margin: 0 0 0.6rem; }
.post-creatives .creatives { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.6rem; }
.post-creatives .creative .cap { font-size: 0.8rem; padding: 0.5rem 0.6rem 0; }
.post-creatives .creative a { margin: 0.35rem 0.6rem 0.6rem; font-size: 0.8rem; }
.creative .noimg { aspect-ratio: 4 / 5; display: grid; place-items: center; background: var(--tag); color: var(--muted); font-size: 0.8rem; padding: 0.5rem; text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 0.7rem 1.1rem; border-radius: 8px; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="intro" id="intro"></div>

  <section class="panel" id="voice-panel" hidden>
    <h3>Хто пише</h3>
    <p class="hint">Обери, з якої позиції ти розповідаєш</p>
    <div class="chips" id="voices"></div>
  </section>

  <section class="panel">
    <h3>Тип гачка</h3>
    <p class="hint">Залиш порожнім, щоб використати всі типи</p>
    <div class="chips" id="types"></div>
  </section>

  <section class="panel">
    <h3>Акцент</h3>
    <p class="hint">До двох одночасно. Залиш порожнім, щоб використати всі</p>
    <div class="chips" id="accents"></div>
  </section>

  <div class="actions">
    <button class="btn primary" id="gen3">Згенерувати 3 варіанти</button>
    <button class="btn" id="gen1">Згенерувати випадковий текст</button>
  </div>

  <div id="results" aria-live="polite"><p class="empty">Тут з’являться тексти</p></div>

  <section id="creatives-section" hidden>
    <h2>Усі креативи</h2>
    <div class="creatives" id="creatives"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script type="application/json" id="campaign-data">{"slug": "demo-thursday-talks", "title": "Демо: Thursday Talks про AI в продукті", "intro": ["Це демо-сторінка, щоб показати, як працює конструктор. Факти тут вигадані.", "Обери тип гачка й акцент або просто натисни кнопку: конструктор збере пост з перевірених блоків. Скопіюй, додай щось від себе і публікуй."], "hook_types": [{"id": "fact", "name": "Неочевидний факт"}, {"id": "question", "name": "Провокативне питання"}, {"id": "insight", "name": "Інсайт з досвіду"}], "accents": [{"id": "ai", "name": "AI в роботі команд"}, {"id": "community", "name": "Спільнота і знання"}], "hooks": [{"id": "h1", "hook_type": "fact", "text": "Половину прототипів у нашій команді минулого кварталу зібрали люди, які не пишуть код щодня."}, {"id": "h2", "hook_type": "question", "text": "Що буде з продуктовою командою, якщо від ідеї до робочого прототипу — один вечір?"}, {"id": "h3", "hook_type": "insight", "text": "Найкорисніше, що я зробив цього місяця, — перестав чекати ідеального ТЗ і зібрав чернетку сам."}, {"id": "h4", "hook_type": "fact", "text": "Минулого четверга в одній кімнаті зібралися дизайнери, аналітики й інженери — і ніхто не пішов раніше."}], "bodies": [{"id": "b1", "accents": ["ai"], "text": "У Universe ми регулярно робимо Thursday Talks — відкриті зустрічі, де команди діляться тим, що реально працює.\n\nЦього разу говорили про AI в щоденній роботі: як пришвидшити шлях від гіпотези до прототипу і що з цього доходить до продукту.\n\nМені найбільше відгукнулось, що інструменти не замінюють продуктового мислення. Вони просто прибирають паузу між «а що, якщо» і «давай перевіримо»."}, {"id": "b2", "accents": ["ai"], "text": "Ми любимо виклики, тому Thursday Talks — це не про красиві слайди, а про реальні кейси.\n\nКоманди показали, як AI допомагає швидше тестувати ідеї, писати аналітичні запити й готувати дослідження.\n\nДля мене це про зв'язок: що швидше я перевіряю свою гіпотезу, то швидше команда отримує відповідь, а продукт — рішення."}, {"id": "b3", "accents": ["community"], "text": "Thursday Talks — це формат, де знання не застрягають в одній команді.\n\nЛюди з різних продуктів сідають поруч і чесно розповідають, що спрацювало, а що ні. Без «успішного успіху», з конкретикою.\n\nЯ щоразу виходжу з кількома ідеями, які наступного дня пробую у своїй роботі."}, {"id": "b4", "accents": ["community", "ai"], "text": "Цього четверга тема була про AI в продукті, але насправді — про людей.\n\nПро те, як інженери вчать дизайнерів збирати прототипи, а аналітики діляться промптами, які економлять години.\n\nРівень Universe росте разом з рівнем кожного з нас, і такі зустрічі — один з найпростіших способів це відчути."}, {"id": "b5", "accents": ["community"], "text": "Я давно помітив: найкращі ідеї в нас народжуються не на плануваннях, а в розмовах між командами.\n\nThursday Talks — саме такий простір. Відкритий, чесний, з питаннями з залу, на які спікери не завжди мають готову відповідь.\n\nІ це, мабуть, найцінніше: можна прийти з питанням і піти з трьома новими."}], "endings": [{"id": "e1", "text": "Записи попередніх Thursday Talks — на сайті uni.tech. Якщо цікаво, який кейс зачепив мене найбільше, — пишіть у коментарях."}, {"id": "e2", "text": "А як у вашій команді AI змінив щоденну роботу? Цікаво порівняти."}, {"id": "e3", "text": "Дякую всім спікерам і команді, яка це організувала. Наступна зустріч уже скоро.\n\n#Universe #ThursdayTalks"}, {"id": "e4", "text": "Якщо хочете працювати в середовищі, де такі розмови — норма, зазирніть у вакансії Universe: uni.tech/careers"}], "voices": [], "creatives": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAyCAIAAACh0Q7HAAAANElEQVR4nO3NMQ0AAAgDsPniwL8D5CCDgyb9m+o5EbFYLBaLxWKxWCwWi8VisVgsFos/xwskHVE3rAu4vgAAAABJRU5ErkJggg==", "caption": "AI-постер", "tags": ["ai"], "filename": "poster.png", "preview": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAyCAIAAACh0Q7HAAAANElEQVR4nO3NMQ0AAAgDsPniwL8D5CCDgyb9m+o5EbFYLBaLxWKxWCwWi8VisVgsFos/xwskHVE3rAu4vgAAAABJRU5ErkJggg==", "href": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAyCAIAAACh0Q7HAAAANElEQVR4nO3NMQ0AAAgDsPniwL8D5CCDgyb9m+o5EbFYLBaLxWKxWCwWi8VisVgsFos/xwskHVE3rAu4vgAAAABJRU5ErkJggg=="}, {"drive_id": "1FAKEidForTest", "caption": "Спільнота (Drive)", "tags": ["community"], "preview": "https://drive.google.com/thumbnail?id=1FAKEidForTest&sz=w800", "href": "https://drive.google.com/uc?export=download&id=1FAKEidForTest"}, {"src": "https://uni.tech", "caption": "Відео-анонс", "kind": "link", "tags": [], "href": "https://uni.tech"}]}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('campaign-data').textContent);
  const $ = (id) => document.getElementById(id);
  const typeName = Object.fromEntries(D.hook_types.map((t) => [t.id, t.name]));
  const accentName = Object.fromEntries(D.accents.map((a) => [a.id, a.name]));
  const voiceName = Object.fromEntries((D.voices || []).map((v) => [v.id, v.name]));
  const hasVoices = (D.voices || []).length > 1;

  const state = { voice: hasVoices ? D.voices[0].id : null, types: new Set(), accents: new Set(), used: new Set() };

  $('title').textContent = D.title;
  for (const p of D.intro) { const el = document.createElement('p'); el.textContent = p; $('intro').appendChild(el); }

  function chip(label, pressed, onClick) {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = label;
    b.setAttribute('aria-pressed', String(pressed));
    b.addEventListener('click', () => onClick(b));
    return b;
  }

  function renderChips() {
    if (hasVoices) {
      $('voice-panel').hidden = false;
      $('voices').replaceChildren(...D.voices.map((v) => chip(v.name, state.voice === v.id, () => {
        state.voice = v.id; state.used.clear(); renderChips();
      })));
    }
    $('types').replaceChildren(...D.hook_types.map((t) => chip(t.name, state.types.has(t.id), () => {
      state.types.has(t.id) ? state.types.delete(t.id) : state.types.add(t.id); renderChips();
    })));
    const full = state.accents.size >= 2;
    $('accents').replaceChildren(...D.accents.map((a) => {
      const on = state.accents.has(a.id);
      const c = chip(a.name, on, () => {
        on ? state.accents.delete(a.id) : state.accents.add(a.id); renderChips();
      });
      if (full && !on) { c.disabled = true; c.title = 'Можна обрати до двох акцентів'; }
      return c;
    }));
  }

  const forVoice = (b) => !b.voices || b.voices.length === 0 || !state.voice || b.voices.includes(state.voice);
  function pools(useFilters) {
    return {
      hooks: D.hooks.filter((h) => forVoice(h) && (!useFilters || state.types.size === 0 || state.types.has(h.hook_type))),
      bodies: D.bodies.filter((b) => forVoice(b) && (!useFilters || state.accents.size === 0 || b.accents.some((a) => state.accents.has(a)))),
      endings: D.endings.filter(forVoice),
    };
  }

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  function combos(n, useFilters) {
    const p = pools(useFilters);
    if (!p.hooks.length || !p.bodies.length || !p.endings.length) return null;
    const total = p.hooks.length * p.bodies.length * p.endings.length;
    const out = [], local = new Set();
    for (let tries = 0; out.length < n && tries < 500; tries++) {
      const h = pick(p.hooks), b = pick(p.bodies), e = pick(p.endings);
      const key = h.id + b.id + e.id;
      if (local.has(key) || (state.used.has(key) && state.used.size < total)) continue;
      local.add(key); state.used.add(key);
      out.push({ h, b, e });
    }
    return out;
  }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('Скопійовано');
  }

  function download(text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = (D.slug || 'post') + '.txt';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  const creatives = D.creatives || [];
  function tile(c) {
    const el = document.createElement('div'); el.className = 'creative';
    if (c.kind !== 'link' && c.preview) {
      const img = document.createElement('img'); img.src = c.preview; img.alt = c.caption || 'Креатив'; img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.addEventListener('error', () => {
        const ph = document.createElement('div'); ph.className = 'noimg'; ph.textContent = 'Превʼю недоступне — файл можна завантажити';
        img.replaceWith(ph);
      });
      el.appendChild(img);
    }
    const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = c.caption || '';
    const a = document.createElement('a'); a.href = c.href || c.src;
    if (c.kind === 'link') { a.textContent = 'Відкрити'; a.target = '_blank'; a.rel = 'noopener'; }
    else {
      a.textContent = 'Завантажити';
      if (c.drive_id) { a.target = '_blank'; a.rel = 'noopener'; } else { a.download = c.filename || 'creative'; }
    }
    el.append(cap, a);
    return el;
  }
  function creativesFor(h, b) {
    const keys = new Set([h.hook_type, ...b.accents]);
    const matched = creatives.filter((c) => (c.tags || []).some((t) => keys.has(t)));
    return matched.length ? matched : creatives.filter((c) => !c.tags || c.tags.length === 0);
  }

  function card({ h, b, e }) {
    const text = [h.text, b.text, e.text].map((s) => s.trim()).join('\n\n');
    const el = document.createElement('article'); el.className = 'post';
    const tags = document.createElement('div'); tags.className = 'tags';
    const names = [typeName[h.hook_type], ...b.accents.map((a) => accentName[a])];
    if (hasVoices && state.voice) names.unshift(voiceName[state.voice]);
    for (const n of names) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = n; tags.appendChild(t); }
    const body = document.createElement('p'); body.className = 'post-text'; body.textContent = text;
    const foot = document.createElement('div'); foot.className = 'post-foot';
    const c = document.createElement('button'); c.className = 'btn primary small'; c.textContent = 'Скопіювати';
    c.addEventListener('click', () => copy(text));
    const d = document.createElement('button'); d.className = 'btn small'; d.textContent = 'Завантажити .txt';
    d.addEventListener('click', () => download(text));
    const n = document.createElement('span'); n.className = 'count'; n.textContent = text.length + ' символів';
    foot.append(c, d, n);
    el.append(tags, body, foot);
    const cs = creativesFor(h, b);
    if (cs.length) {
      const wrap = document.createElement('div'); wrap.className = 'post-creatives';
      const t = document.createElement('h4'); t.textContent = 'Креативи до цього поста';
      const grid = document.createElement('div'); grid.className = 'creatives';
      grid.replaceChildren(...cs.map(tile));
      wrap.append(t, grid); el.appendChild(wrap);
    }
    return el;
  }

  function show(n, useFilters) {
    const list = combos(n, useFilters);
    const box = $('results');
    if (!list) {
      const p = document.createElement('p'); p.className = 'empty';
      p.textContent = 'Для такого поєднання текстів немає. Зніми один з фільтрів.';
      box.replaceChildren(p); return;
    }
    box.replaceChildren(...list.map(card));
    box.firstElementChild.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }

  $('gen3').addEventListener('click', () => show(3, true));
  $('gen1').addEventListener('click', () => show(1, false));

  if (D.creatives && D.creatives.length) {
    $('creatives-section').hidden = false;
    $('creatives').replaceChildren(...D.creatives.map(tile));
  }

  renderChips();
})();
</script>
</body>
</html>
