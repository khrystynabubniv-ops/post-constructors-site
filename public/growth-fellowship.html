ource=linkedin&utm_medium=employee_post&utm_campaign=growth_fellowship"}, {"id": "e2", "text": "Якщо впізнаєш себе в цьому описі, заявку можна подати тут: https://unieducation.co/?utm_source=linkedin&utm_medium=employee_post&utm_campaign=growth_fellowship"}, {"id": "e3", "text": "Знаєте когось, хто запускав власний стартап і шукає наступний виклик? Поділіться з ним цим постом. Деталі: https://unieducation.co/?utm_source=linkedin&utm_medium=employee_post&utm_campaign=growth_fellowship"}, {"id": "e4", "text": "Заявки розглядають постійно, фіксованого дедлайну немає. Подати заявку можна тут: https://unieducation.co/?utm_source=linkedin&utm_medium=employee_post&utm_campaign=growth_fellowship"}, {"id": "e5", "text": "Якщо є питання про Universe чи програму — пишіть у коментарях або в особисті. Деталі й заявка: https://unieducation.co/?utm_source=linkedin&utm_medium=employee_post&utm_campaign=growth_fellowship"}, {"id": "e6", "text": "А який власний проєкт навчив вас найбільше? Поділіться в коментарях 👇\n\nПро програму: https://unieducation.co/?utm_source=linkedin&utm_medium=employee_post&utm_campaign=growth_fellowship"}, {"id": "e7", "text": "Dare to challenge yourself? We’re in.\n\nUniverse Growth Fellowship: https://unieducation.co/?utm_source=linkedin&utm_medium=employee_post&utm_campaign=growth_fellowship"}, {"id": "e8", "text": "Поділіться постом з тим, кому зараз тісно в межах власного проєкту. Можливо, це і є наступний рівень: https://unieducation.co/?utm_source=linkedin&utm_medium=employee_post&utm_campaign=growth_fellowship"}, {"id": "e9", "text": "Етапи відбору, умови й відповіді на часті питання — на сайті програми: https://unieducation.co/?utm_source=linkedin&utm_medium=employee_post&utm_campaign=growth_fellowship\n\n#Universe #GrowthFellowship"}, {"id": "e10", "text": "Переходь на наступний рівень: https://unieducation.co/?utm_source=linkedin&utm_medium=employee_post&utm_campaign=growth_fellowship"}, {"id": "e11", "text": "Цікаво, хто з моєї мережі вже запус &utm_medium=employee_post&utm_campaign=growth_fellowship"}], "voices": [], "creatives": []}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('campaign-data').textContent);
  const $ = (id) => document.getElementById(id);
  const typeName = Object.fromEntries(D.hook_types.map((t) => [t.id, t.name]));
  const accentName = Object.fromEntries(D.accents.map((a) => [a.id, a.name]));
  const voiceName = Object.fromEntries((D.voices || []).map((v) => [v.id, v.name]));
  const hasVoices = (D.voices || []).length > 1;

  const state = { voice: hasVoices ? D.voices[0].id : null, types: new Set(), accents: new Set(), used: new Set() };

  $('title').textContent = D.title;
  for (const p of D.intro) { const el = document.createElement('p'); el.textContent = p; $('intro').appendChild(el); }

  function chip(label, pressed, onClick) {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = label;
    b.setAttribute('aria-pressed', String(pressed));
    b.addEventListener('click', () => onClick(b));
    return b;
  }

  function renderChips() {
    if (hasVoices) {
      $('voice-panel').hidden = false;
      $('voices').replaceChildren(...D.voices.map((v) => chip(v.name, state.voice === v.id, () => {
        state.voice = v.id; state.used.clear(); renderChips();
      })));
    }
    $('types').replaceChildren(...D.hook_types.map((t) => chip(t.name, state.types.has(t.id), () => {
      state.types.has(t.id) ? state.types.delete(t.id) : state.types.add(t.id); renderChips();
    })));
    const full = state.accents.size >= 2;
    $('accents').replaceChildren(...D.accents.map((a) => {
      const on = state.accents.has(a.id);
      const c = chip(a.name, on, () => {
        on ? state.accents.delete(a.id) : state.accents.add(a.id); renderChips();
      });
      if (full && !on) { c.disabled = true; c.title = 'Можна обрати до двох акцентів'; }
      return c;
    }));
  }

  const forVoice = (b) => !b.voices || b.voices.length === 0 || !state.voice || b.voices.includes(state.voice);
  function pools(useFilters) {
    return {
      hooks: D.hooks.filter((h) => forVoice(h) && (!useFilters || state.types.size === 0 || state.types.has(h.hook_type))),
      bodies: D.bodies.filter((b) => forVoice(b) && (!useFilters || state.accents.size === 0 || b.accents.some((a) => state.accents.has(a)))),
      endings: D.endings.filter(forVoice),
    };
  }

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  function combos(n, useFilters) {
    const p = pools(useFilters);
    if (!p.hooks.length || !p.bodies.length || !p.endings.length) return null;
    const total = p.hooks.length * p.bodies.length * p.endings.length;
    const out = [], local = new Set();
    for (let tries = 0; out.length < n && tries < 500; tries++) {
      const h = pick(p.hooks), b = pick(p.bodies), e = pick(p.endings);
      const key = h.id + b.id + e.id;
      if (local.has(key) || (state.used.has(key) && state.used.size < total)) continue;
      local.add(key); state.used.add(key);
      out.push({ h, b, e });
    }
    return out;
  }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('Скопійовано');
  }

  function download(text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = (D.slug || 'post') + '.txt';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  const creatives = D.creatives || [];
  function tile(c) {
    const el = document.createElement('div'); el.className = 'creative';
    if (c.kind !== 'link' && c.preview) {
      const img = document.createElement('img'); img.src = c.preview; img.alt = c.caption || 'Креатив'; img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.addEventListener('error', () => {
        const ph = document.createElement('div'); ph.className = 'noimg'; ph.textContent = 'Превʼю недоступне — файл можна завантажити';
        img.replaceWith(ph);
      });
      el.appendChild(img);
    }
    const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = c.caption || '';
    const a = document.createElement('a'); a.href = c.href || c.src;
    if (c.kind === 'link') { a.textContent = 'Відкрити'; a.target = '_blank'; a.rel = 'noopener'; }
    else {
      a.textContent = 'Завантажити';
      if (c.drive_id) { a.target = '_blank'; a.rel = 'noopener'; } else { a.download = c.filename || 'creative'; }
    }
    el.append(cap, a);
    return el;
  }
  function creativesFor(h, b) {
    const keys = new Set([h.hook_type, ...b.accents]);
    const matched = creatives.filter((c) => (c.tags || []).some((t) => keys.has(t)));
    return matched.length ? matched : creatives.filter((c) => !c.tags || c.tags.length === 0);
  }

  function card({ h, b, e }) {
    const text = [h.text, b.text, e.text].map((s) => s.trim()).join('\n\n');
    const el = document.createElement('article'); el.className = 'post';
    const tags = document.createElement('div'); tags.className = 'tags';
    const names = [typeName[h.hook_type], ...b.accents.map((a) => accentName[a])];
    if (hasVoices && state.voice) names.unshift(voiceName[state.voice]);
    for (const n of names) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = n; tags.appendChild(t); }
    const body = document.createElement('p'); body.className = 'post-text'; body.textContent = text;
    const foot = document.createElement('div'); foot.className = 'post-foot';
    const c = document.createElement('button'); c.className = 'btn primary small'; c.textContent = 'Скопіювати';
    c.addEventListener('click', () => copy(text));
    const d = document.createElement('button'); d.className = 'btn small'; d.textContent = 'Завантажити .txt';
    d.addEventListener('click', () => download(text));
    const n = document.createElement('span'); n.className = 'count'; n.textContent = text.length + ' символів';
    foot.append(c, d, n);
    el.append(tags, body, foot);
    const cs = creativesFor(h, b);
    if (cs.length) {
      const wrap = document.createElement('div'); wrap.className = 'post-creatives';
      const t = document.createElement('h4'); t.textContent = 'Креативи до цього поста';
      const grid = document.createElement('div'); grid.className = 'creatives';
      grid.replaceChildren(...cs.map(tile));
      wrap.append(t, grid); el.appendChild(wrap);
    }
    return el;
  }

  function show(n, useFilters) {
    const list = combos(n, useFilters);
    const box = $('results');
    if (!list) {
      const p = document.createElement('p'); p.className = 'empty';
      p.textContent = 'Для такого поєднання текстів немає. Зніми один з фільтрів.';
      box.replaceChildren(p); return;
    }
    box.replaceChildren(...list.map(card));
    box.firstElementChild.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }

  $('gen3').addEventListener('click', () => show(3, true));
  $('gen1').addEventListener('click', () => show(1, false));

  if (D.creatives && D.creatives.length) {
    $('creatives-section').hidden = false;
    $('creatives').replaceChildren(...D.creatives.map(tile));
  }

  renderChips();
})();
</script>
